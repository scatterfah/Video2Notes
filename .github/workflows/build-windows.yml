name: Build Windows app

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Download FFmpeg and Deno
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path bin | Out-Null

          Invoke-WebRequest "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-lgpl.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_tmp
          $ff = Get-ChildItem ffmpeg_tmp -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          Copy-Item $ff.FullName bin\ffmpeg.exe

          Invoke-WebRequest "https://github.com/denoland/deno/releases/latest/download/deno-x86_64-pc-windows-msvc.zip" -OutFile deno.zip
          Expand-Archive deno.zip -DestinationPath bin

      - name: Build note.exe
        run: >
          pyinstaller --onefile --noconsole --name note
          --collect-all yt_dlp_ejs
          --add-binary "bin\ffmpeg.exe;."
          --add-binary "bin\deno.exe;."
          app.py

      - name: Keep the build as a downloadable file
        uses: actions/upload-artifact@v4
        with:
          name: note-windows
          path: dist/note.exe

      - name: Attach note.exe to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/note.exe
